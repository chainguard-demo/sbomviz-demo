name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:

      - uses: chainguard-dev/setup-chainctl@9014a6ef4f9783eef6414ed71e92fcecf152dfe7 # main
        with:
          identity: 45a0c61ea6fd977f050c5fb9ac06a69eed764595/10f82a4f744469b7

      - name: Check out repository
        uses: chainguard-actions/actions-checkout@279383ec3b8d70f964ffa5a2151ea3d2a5317ec6 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: chainguard-actions/actions-setup-python@9bc81c95771c379a24d235203ec35ccbac904e5a # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest
